<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prime Spark</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 50px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
    }
    h1 {
      color: white;
      font-size: 40px;
      margin-bottom: 20px;
    }
    .mic-button {
      background-color: #4285F4;
      border: none;
      border-radius: 50%;
      width: 120px;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px auto;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .mic-glow {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(66, 133, 244, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(66, 133, 244, 0); }
      100% { box-shadow: 0 0 0 0 rgba(66, 133, 244, 0); }
    }
    #mic-icon {
      width: 60px;
      height: 60px;
      transition: all 0.3s ease;
    }
    #waveform {
      display: none;
      justify-content: center;
      align-items: center;
      height: 60px;
      gap: 3px;
    }
    .bar {
      width: 5px;
      height: 20px;
      background: white;
      border-radius: 5px;
      animation: sound 0.8s infinite ease-in-out;
    }
    .bar:nth-child(1) { animation-delay: -0.4s; }
    .bar:nth-child(2) { animation-delay: -0.2s; }
    .bar:nth-child(3) { animation-delay: 0s; }
    .bar:nth-child(4) { animation-delay: 0.2s; }
    .bar:nth-child(5) { animation-delay: 0.4s; }
    @keyframes sound {
      0% { height: 20px; }
      50% { height: 50px; }
      100% { height: 20px; }
    }
    #response-text {
      color: white;
      font-size: 20px;
      margin-top: 30px;
      font-weight: 500;
      min-height: 50px;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }
    #response-text.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Prime Spark's Voice Assistant</h1>

    <button class="mic-button" id="micButton" onclick="startListening()">
      <img id="mic-icon" src="https://img.icons8.com/ios-filled/100/ffffff/microphone.png" alt="Microphone" style="display:block;">
      <div id="waveform">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
    </button>

    <div id="response-text">Press the mic and speak...</div>
    <audio id="audioPlayer" hidden></audio> <!-- hidden player -->
  </div>

  <script>
    let polling = false;
    let intervalId = null;
    let audioPlayer = document.getElementById('audioPlayer');

    function startListening() {
      const micButton = document.getElementById('micButton');
      const micIcon = document.getElementById('mic-icon');
      const waveform = document.getElementById('waveform');
      const responseText = document.getElementById('response-text');

      responseText.innerText = "Listening... 🎤";
      responseText.classList.add('show');
      micButton.classList.add('mic-glow');
      micIcon.style.display = "block";
      waveform.style.display = "none";

      fetch('/voice-command', { method: 'POST' })
        .then(response => response.json())
        .then(data => {
          console.log(data);
          if (!polling) {
            polling = true;
            intervalId = setInterval(pollForResponse, 1000);
          }
        })
        .catch(error => {
          console.error(error);
          responseText.innerText = "Error!";
        });
    }

    function pollForResponse() {
      const micButton = document.getElementById('micButton');
      const micIcon = document.getElementById('mic-icon');
      const waveform = document.getElementById('waveform');
      const responseText = document.getElementById('response-text');

      fetch('/get-response')
        .then(response => response.json())
        .then(data => {
          console.log(data);

          if (data.status === "speaking") {
            micButton.classList.remove('mic-glow');
            micIcon.style.display = "none";
            waveform.style.display = "flex";

            responseText.innerText = data.response;
            responseText.classList.add('show');

            if (data.audio_url) {
              audioPlayer.src = data.audio_url;
              audioPlayer.play();
            }
          }

          if (data.status === "idle") {
            micIcon.style.display = "block";
            waveform.style.display = "none";
            micButton.classList.remove('mic-glow');

            responseText.innerText = data.response;
            responseText.classList.add('show');

            clearInterval(intervalId);
            polling = false;
          }
        })
        .catch(error => {
          console.error(error);
          clearInterval(intervalId);
          polling = false;
        });
    }

    // When the audio finishes playing, automatically fetch next
    audioPlayer.addEventListener('ended', function() {
      console.log('Audio finished');
      document.getElementById('response-text').classList.remove('show');
      // Optionally: Immediately start a new listening round
      // startListening();
    });
  </script>

</body>
</html>
